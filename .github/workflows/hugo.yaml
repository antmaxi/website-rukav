name: Build and deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    # Compile on every clone (including forks). Deploy stays on the org repo so
    # a fork with GitHub Pages set to "Deploy from a branch" does not fight the
    # Hugo workflow, and so forks cannot publish to rukav-swiss.ch.
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.97.2
      HUGO_VERSION: 0.164.0
      TZ: Europe/Zurich
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          archive="${RUNNER_TEMP}/dart-sass.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "814df31fa1ba98d15ccea390ac0d8fa00e26cecb075c6b764e35fa61da1cb720  ${archive}" | sha256sum --check --strict
          tar -C "${HOME}/.local" -xf "${archive}"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          archive="${RUNNER_TEMP}/hugo.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  ${archive}" | sha256sum --check --strict
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${archive}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Hugo: $(hugo version)"
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Upload artifact
        if: github.repository == 'rukav-swiss/website-rukav' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./public
  deploy:
    if: github.repository == 'rukav-swiss/website-rukav' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4