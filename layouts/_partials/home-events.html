{{/*
  Home page events list. All items are in the HTML (no `hidden`), so crawlers
  and AI bots that do not run JavaScript still see the full list.
*/}}
{{- $events := .events -}}

<section class="home-events pa3 pa4-ns w-100 w-70-ns center" aria-labelledby="home-events-heading">
  <h2 id="home-events-heading" class="f3 fw2 tc {{ site.Params.text_color | default "mid-gray" }}">
    {{ lang.Translate "homeEvents" }}
  </h2>
  <div class="home-events__list w-100 mw8">
    {{- range $events -}}
    <div class="home-events__item w-100 mb4 relative">
      {{ .Render "summary-with-image" }}
    </div>
    {{- end -}}
  </div>
</section>
